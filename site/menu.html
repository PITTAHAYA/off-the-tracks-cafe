<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — Off the Tracks</title>
<meta name="description" content="Coffee, pastry, breakfast and lunch at Off the Tracks, Railspur Alley, Granville Island.">
<meta name="theme-color" content="#F6F1E7">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* ── menu only ─────────────────────────────────────────── */
.head{padding:26px var(--pad) 4px}
.head h1{font-size:clamp(34px,10vw,48px)}

.tabs{
  position:sticky;top:var(--top);z-index:40;
  padding:12px var(--pad);background:rgba(246,241,231,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);margin-top:18px;
}
.tabs__row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs__row::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:9px 15px;border-radius:100px;border:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-60);white-space:nowrap;min-height:36px;transition:all .3s var(--ease);
}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--cream)}

.panel{padding:20px var(--pad) 34px;max-width:var(--maxw);margin:0 auto}

/* photo cards — the picture does the describing */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mcard{
  background:var(--cream-2);border:1px solid var(--line);border-radius:3px;overflow:hidden;
  display:flex;flex-direction:column;
}
.mcard__ph{position:relative;aspect-ratio:1/1;overflow:hidden}
.mcard__ph img{width:100%;height:100%;object-fit:cover}
/* awaiting a photo — the house mark, not a grey box */
.mcard__ph--none{
  display:grid;place-items:center;color:rgba(27,26,23,.16);
  background:
    repeating-linear-gradient(45deg,rgba(27,26,23,.025) 0 8px,transparent 8px 16px),
    var(--cream);
}
.mcard__ph--none svg{width:34%;height:34%}
.mcard__tag{
  position:absolute;top:8px;left:8px;background:var(--terra);color:#fff;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;
}
.mcard__in{padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard h3{font-size:15px;line-height:1.2}
.mcard__d{font-size:12px;line-height:1.45;color:var(--ink-60);margin:0}
.mcard__on{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-40);margin:0}
.mcard__foot{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:2px}
.price{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--terra)}
.chip{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:2px 5px;border-radius:2px;
  border:1px solid rgba(34,64,46,.32);color:var(--fir);
}

/* one photo opens each tab, then the list */
.mhero{margin:0 0 22px}
.mhero img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:3px}
.mhero figcaption{
  margin-top:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-40);
}
.mfoot{
  margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);
  font-size:13.5px;line-height:1.55;color:var(--ink-60);max-width:46ch;
}

/* rows — name, and nothing it doesn't need */
.mrows{border-top:1px solid var(--line)}
.mrow{display:flex;align-items:baseline;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.mrow__n{font-family:var(--serif);font-size:18px;font-weight:600;flex:none}
.mrow__n i{
  font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-40);margin-left:9px;
}
.mrow__dot{flex:1;border-bottom:1px dotted rgba(27,26,23,.3);transform:translateY(-4px)}
.mrow__sizes{flex-basis:100%;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--ink-40);margin-top:2px}

.legend{
  margin:0 auto;padding:0 var(--pad) 34px;max-width:var(--maxw);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-40);display:flex;gap:16px;flex-wrap:wrap;
}
.note{
  margin:26px var(--pad) 0;padding:14px 16px;border-left:2px solid var(--brass);
  background:var(--cream-2);font-size:13px;line-height:1.55;color:var(--ink-60);
}
.note b{font-family:var(--serif);color:var(--ink);display:block;font-size:14.5px;margin-bottom:2px}

@media(min-width:760px){ .mgrid{grid-template-columns:repeat(3,1fr);gap:16px} }

/* ── desktop menu: centred, roomy, a real grid ─────────── */
@media(min-width:900px){
  .head{max-width:var(--maxw);margin:0 auto;padding:44px var(--pad) 8px;text-align:center}
  .head h1{font-size:60px}
  .tabs{
    padding:16px var(--pad);background:rgba(246,241,231,.92);
    border-bottom:1px solid var(--line);
  }
  .tabs__row{max-width:var(--maxw);margin:0 auto;justify-content:center;gap:10px}
  .tab{font-size:11px;padding:11px 20px;min-height:42px}

  .panel{padding:38px var(--pad) 60px}

  /* tab hero becomes a contained banner, not a giant square */
  .mhero{max-width:var(--maxw);margin:0 auto 34px;position:relative}
  .mhero img{aspect-ratio:21/7;max-height:340px;border-radius:5px}
  .mhero figcaption{
    position:absolute;left:20px;bottom:16px;margin:0;color:var(--cream);
    text-shadow:0 1px 8px rgba(12,20,32,.6);
  }

  .mgrid{grid-template-columns:repeat(4,1fr);gap:20px}
  .mcard{border-radius:5px}
  .mcard__in{padding:14px 15px 16px}
  .mcard h3{font-size:16.5px}
  .mcard__d{font-size:12.5px}

  /* drinks split into two columns, each a clean price list */
  .mrows{columns:2;column-gap:56px;border-top:0}
  .mrow{
    break-inside:avoid;border-top:1px solid var(--line);border-bottom:0;
    padding:14px 0;
  }
  .mfoot,.legend{text-align:center}
  .legend{justify-content:center}
}
@media(min-width:1200px){ .mrows{column-gap:80px} }
</style>
</head>
<body>

<header class="top">
  <a class="top__name" href="index.html" aria-label="Off the Tracks, home">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="10" stroke="#C89B5A" stroke-width="1.3"/>
      <path d="M3.5 12h17M7 9v6M11 9v6M15 9v6" stroke="#C4633C" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    Off the Tracks
  </a>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="status__dot"></span><span class="status__txt">Hours</span>
  </div>
</header>

<main>
  <div class="head">
    <p class="eyebrow">All day</p>
    <h1>Menu</h1>
  </div>

  <div class="tabs">
    <div class="tabs__row" role="tablist" aria-label="Menu categories" id="tabs"></div>
  </div>

  <div class="panel" id="panel"></div>

  <p class="legend"><span>V — Vegetarian</span><span>GF — Gluten free</span></p>
</main>

<nav class="line" aria-label="Main">
  <a class="stop" href="index.html"><span class="stop__pin"></span>Home</a>
  <a class="stop" href="menu.html" aria-current="page"><span class="stop__pin"></span>Menu</a>
  <a class="stop" href="place.html"><span class="stop__pin"></span>Place</a>
  <a class="stop" href="visit.html"><span class="stop__pin"></span>Visit</a>
  <a class="stop" href="rewards.html"><span class="stop__pin"></span>Stamps</a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="content.js"></script>
<script src="app.js"></script>
<script src="order.js"></script>
</body>
</html>
