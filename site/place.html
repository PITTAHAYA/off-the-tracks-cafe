<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Place — Off the Tracks</title>
<meta name="description" content="Inside Off the Tracks: the alley, the room, the table. Railspur Alley, Granville Island.">
<meta name="theme-color" content="#F6F1E7">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">

<style>
/* ── place only: pictures, barely any words ────────────── */
.head{padding:26px var(--pad) 0}
.head h1{font-size:clamp(34px,10vw,48px)}
.head p{
  margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-40);
}

.gal{columns:2;column-gap:10px;padding:24px var(--pad) 30px;max-width:var(--maxw);margin:0 auto}
.gitem{
  display:block;width:100%;margin:0 0 10px;padding:0;border-radius:2px;overflow:hidden;
  break-inside:avoid;background:var(--cream-2);
}
.gitem img{width:100%;height:auto;transition:transform .6s var(--ease),opacity .6s var(--ease)}
@media(hover:hover){.gitem:hover img{transform:scale(1.04)}}

.band{
  background:var(--fir);color:var(--cream);padding:38px var(--pad) 42px;text-align:center;
}
.band p{
  font-family:var(--serif);font-size:24px;line-height:1.3;letter-spacing:-.02em;margin:0 0 20px;
}
.band .btn{max-width:320px;margin:0 auto;border-color:rgba(246,241,231,.35);color:var(--cream)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(12,20,32,.97);display:none;
  align-items:center;justify-content:center;opacity:0;transition:opacity .28s var(--ease)}
.lb.open{display:flex}
.lb.show{opacity:1}
.lb__img{max-width:100%;max-height:78svh;object-fit:contain;
  transform:translateY(-12px);transition:transform .4s var(--ease-out)}
.lb.show .lb__img{transform:none}
.lb__x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
  width:44px;height:44px;display:grid;place-items:center;color:var(--cream);font-size:26px;line-height:1}
.lb__nav{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:18px;
  color:rgba(246,241,231,.6);font-family:var(--mono);font-size:11px;letter-spacing:.14em}
.lb__nav button{width:44px;height:44px;color:var(--cream);font-size:20px}

@media(min-width:760px){ .gal{columns:4;column-gap:14px} .gitem{margin-bottom:14px} }
</style>
</head>
<body>

<header class="top">
  <a class="top__name" href="index.html" aria-label="Off the Tracks, home">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="10" stroke="#C89B5A" stroke-width="1.3"/>
      <path d="M3.5 12h17M7 9v6M11 9v6M15 9v6" stroke="#C4633C" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    Off the Tracks
  </a>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="status__dot"></span><span class="status__txt">Hours</span>
  </div>
</header>

<main>
  <div class="head">
    <p class="eyebrow">Have a look</p>
    <h1>The Place</h1>
    <p>Tap any photo</p>
  </div>

  <div class="gal" id="gal"></div>

  <section class="band">
    <p class="rv">Best seat on the island.</p>
    <a class="btn btn--out rv" data-d="1" href="visit.html">Find us</a>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb__x" id="lbX" aria-label="Close">×</button>
  <img class="lb__img" id="lbImg" alt="">
  <div class="lb__nav">
    <button id="lbPrev" aria-label="Previous photo">‹</button>
    <span id="lbCount"></span>
    <button id="lbNext" aria-label="Next photo">›</button>
  </div>
</div>

<nav class="line" aria-label="Main">
  <a class="stop" href="index.html"><span class="stop__pin"></span>Home</a>
  <a class="stop" href="menu.html"><span class="stop__pin"></span>Menu</a>
  <a class="stop" href="place.html" aria-current="page"><span class="stop__pin"></span>Place</a>
  <a class="stop" href="visit.html"><span class="stop__pin"></span>Visit</a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
